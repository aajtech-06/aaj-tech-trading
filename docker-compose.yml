version: '3.9'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: aaj_tech_backend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    networks:
      - aaj_tech_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aaj_tech_frontend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend
    networks:
      - aaj_tech_network

networks:
  aaj_tech_network:
    driver: bridge
