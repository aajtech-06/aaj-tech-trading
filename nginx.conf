user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Production Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Hide Nginx version

    # Client limits configuration
    client_max_body_size 100M; 
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream Definitions (using Docker Compose service names as requested)
    upstream nextjs_frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream fastapi_backend {
        server backend:8000;
        keepalive 32;
    }

    # HTTP Server Block
    server {
        listen 80;
        listen [::]:80;
        server_name aajtechtrading.in www.aajtechtrading.in;

        # Shared Reverse Proxy Settings
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Route /api/ to FastAPI Backend
        location /api/ {
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 90;
            proxy_connect_timeout 90;
            proxy_redirect off;
        }

        # Route /uploads/ to FastAPI Backend
        location /uploads/ {
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 90;
            proxy_connect_timeout 90;
            proxy_redirect off;
        }

        # Route remaining traffic to Next.js Frontend
        location / {
            proxy_pass http://nextjs_frontend;
            proxy_read_timeout 90;
            proxy_connect_timeout 90;
            proxy_redirect off;
            
            # Next.js specific caching optimization
            proxy_buffering on;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
